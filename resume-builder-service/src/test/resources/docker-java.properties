# docker-java (used by Testcontainers) reads this file from the test classpath.
# Docker Engine 29 (Docker Desktop 4.52+, and current GitHub runners) refuses
# API versions below 1.44 with 400 "client version 1.32 is too old", which
# surfaces as "Could not find a valid Docker environment". Pinning 1.44 keeps
# GateJourneyIT working locally and in CI. Safe to remove once the
# Testcontainers version alone proves sufficient in both places.
api.version=1.44
