  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      # In compose/k8s EUREKA_URL=http://eureka:8761/eureka (the registry
      # service is named eureka). Env-overridable; localhost default is
      # for running the gateway bare-metal against a local registry.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    # Same env var + dev default as the monolith (root docker-compose.yml).
    # DEV ONLY — set APP_JWT_SECRET to a long random value anywhere shared.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

# Rate limit: 100 req/min per user/IP — token bucket, 2 tokens/sec refill,
# burst of 100. See RateLimitConfig for the exact semantics.
gateway:
  rate-limit:
    replenish-rate: 2
    burst-capacity: 100
    requested-tokens: 1

# Resilience4j, applied per circuit-breaker instance by Spring Cloud
# CircuitBreaker (one instance per downstream: "backend", "mcp-service").
# Defaults on every route:
#   breaker: 50% failure rate over a 10-call count-based window, 30s open,
#            3 half-open probe calls, auto-transition to half-open.
#   time limiter: 3s per attempt (cancel the running call on timeout).
#   bulkhead (semaphore, fast routes): fail fast, no queueing.
#   retry: NOT configured here — retry is the gateway Retry filter (GETs
#          only, max 3, exponential backoff). Configuring resilience4j retry
#          as well would double-retry every failed call.
resilience4j:
  circuitbreaker:
    instances:
      backend:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      mcp-service:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      backend:
        timeoutDuration: 3s
        cancelRunningFuture: true
      mcp-service:
        timeoutDuration: 3s
        cancelRunningFuture: true
  bulkhead:
    instances:
      backend:
        maxConcurrentCalls: 100
        maxWaitDuration: 0
      mcp-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
  threadpoolbulkhead:
    instances:
      coach:
        coreThreadPoolSize: 4
        maxThreadPoolSize: 10
        queueCapacity: 20
        keepAliveDuration: 20ms

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.epitomejob: INFO
