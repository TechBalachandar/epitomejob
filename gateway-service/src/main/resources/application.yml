# EpitomeJob API gateway (Phase 5A).
#
# ROUTE TABLE — paths read from the monolith's controllers at main b59dc45
# (backend/src/main/java/com/epitomejob/*/controller/*Controller.java):
#   /auth/**          AuthController        POST /register /login /refresh /logout
#   /profiles/**      ProfileController     GET|PUT /me
#   /resumes/**       ResumeController      POST /  PUT /{id}  GET /me  GET /{id}/text
#   /jobs/**          JobController         GET /  GET /{id}
#   /matches/**       MatchingController    GET /me  GET /{jobId}
#   /tracker/**       TrackerController     POST /  GET /me  PUT|DELETE /{id}
#   /interviews/**    InterviewController   GET /questions  POST /sessions
#                                       POST /sessions/{id}/answers
#                                       GET /sessions/me  GET /sessions/{id}
#   /coach/**         CoachController       POST /chat
#   /approvals/**     ApprovalController    POST /  POST /{id}/approve|reject  GET /pending
#   /notifications/** NotificationController GET /me  GET /unread-count
#                                       POST /{id}/read  POST /read-all
#   /billing/**       BillingController     GET /status  GET /plans  POST /checkout
#                                       POST /webhook  GET /entitlement/me
#   /plans/**         (no standalone /plans controller exists in the monolith
#                     at b59dc45 — /billing/plans is the live plans endpoint.
#                     This route is forward-compatible: it 404s from the
#                     backend until a standalone plans endpoint exists.)
#   /mcp/**           MCP service (Phase 5B split). Static URI, NOT lb://:
#                     the Python mcp-service does not register with Eureka
#                     (no Java client), so discovery cannot resolve it.
#                     The name mcp-server resolves via compose DNS and the
#                     k8s Service of the same name. Single instance; if it
#                     ever scales, revisit (Eureka sidecar or a Java shim).
#
# SECURITY: /auth/** is public. Every other route requires a valid Bearer
# access JWT — enforced by JwtAuthFilter (a GlobalFilter), NOT by these
# routes: 401 on missing / expired / badly-signed / malformed token, and
# on refresh tokens used as API credentials.
#
# FILTER ORDER on each route (declaration order): RequestRateLimiter runs
# once per request, then Retry (GETs only, re-executes the chain below it),
# then CircuitBreaker (each attempt gets its own 3s time limit and counts
# separately). The coach route additionally runs ThreadPoolBulkhead before
# Retry so LLM work sits on its own pool.
#
# DISCOVERY: every uri is lb://<eureka-service-name> — no host is hardcoded,
# except /mcp/**, which is a static http:// URI (see above).
# INTEGRATION NOTE: the monolith currently registers as "epitomejob"
# (spring.application.name in backend/src/main/resources/application.yml).
# For lb://epitomejob-backend to resolve, the monolith must register under
# that name when its Eureka client is added (rename spring.application.name
# to epitomejob-backend, or change these URIs to lb://epitomejob).

server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false # explicit routes only; no auto-created lb routes
      routes:
        - id: auth
          uri: lb://epitomejob-backend
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 3
                methods: GET
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: true
            - name: CircuitBreaker
              args:
                name: backend
                fallbackUri: forward:/fallback/backend
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
