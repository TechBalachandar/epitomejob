# EpitomeJob Phase 5A — fluent-bit DaemonSet (container logs -> Elasticsearch).
#
# DIVERGENCE FROM COMPOSE, deliberate: kind nodes run containerd, not Docker,
# so there is NO /var/run/docker.sock on a kind node and no
# /var/lib/docker/containers. Here logs are tailed from the standard
# Kubernetes path /var/log/containers/*.log with the kubernetes parser; the
# kubernetes FILTER enriches each record with pod/namespace/labels
# The kubernetes FILTER enriches records from the API, so a dedicated
# ServiceAccount + ClusterRole (get/list/watch pods, namespaces) is included
# below — the default ServiceAccount has no such permissions in kind and
# the filter would log 403s without it. The compose stack instead tails
# /var/lib/docker/containers (see compose/fluent-bit/fluent-bit.conf).
#
# PER-SERVICE INDEX LIMIT (honest, same as compose): fluent-bit 3.2's ES
# output takes a STATIC Index value, so one index per service is not
# achievable with a single output. All logs go to `epitomejob-logs`
# (Logstash_Format Off) and per-service separation is by the
# kubernetes.labels.app field in Kibana. A true per-service index needs a
# rewrite_tag stage + one ES output per service — a follow-up, not faked here.
#
# --- RBAC for the kubernetes filter (get/list/watch pods + namespaces) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: epitomejob
---
# Tolerations: kind's control-plane node is schedulable, but the toleration
# keeps the DaemonSet running even if a taint is added later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Daemon       off
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /tmp/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5
    [FILTER]
        Name              kubernetes
        Match             kube.*
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log         On
        Keep_Log          Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
    [OUTPUT]
        Name              es
        Match             kube.*
        Host              elasticsearch
        Port              9200
        Index             epitomejob-logs
        Type              _doc
        Logstash_Format   Off
        Include_Tag_Key   On
        Tag_Key           fb_tag
        Generate_ID       On
        Replace_Dots      On
        Retry_Limit       False
  parsers.conf: |
    [PARSER]
        Name   cri
        Format regex
        Regex  ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
        app.kubernetes.io/name: epitomejob
        app.kubernetes.io/component: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.6
          imagePullPolicy: IfNotPresent
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
