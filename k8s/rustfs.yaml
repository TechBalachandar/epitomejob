# EpitomeJob W4 — rustfs (MinIO-compatible S3 object storage).
# W4-API-CONTRACT.md §2a/§4/§6: image rustfs/rustfs:1.0.1, ports 9000 (S3 API)
# and 9001 (console). Env names/values match §2a exactly.
#
# The data directory is passed as the positional arg `/data` (the documented
# `docker run ... rustfs/rustfs:latest /data` form) — NO RUSTFS_VOLUMES env var,
# because §2a does not list one. The PVC is mounted at /data.
# The image runs as UID 10001, so fsGroup 10001 makes the volume writable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard # kind's default StorageClass
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
        app.kubernetes.io/name: epitomejob
        app.kubernetes.io/component: rustfs
    spec:
      securityContext:
        fsGroup: 10001 # rustfs runs as UID 10001; volume must be group-writable
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          imagePullPolicy: IfNotPresent
          args: ["/data"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: epitomejob-secrets
                  key: MINIO_SECRET_KEY
            - name: RUSTFS_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: RUSTFS_ADDRESS
            - name: RUSTFS_CONSOLE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: RUSTFS_CONSOLE_ADDRESS
            - name: RUSTFS_CONSOLE_ENABLE
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: RUSTFS_CONSOLE_ENABLE
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: rustfs
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
