# EpitomeJob W4 — temporal server (auto-setup image, Postgres persistence).
# W4-API-CONTRACT.md §2a/§3a/§4/§6, CORRECTED per stack-worker verification
# (Docker Hub 2026-11-12): temporalio/auto-setup:1.32.2 DOES NOT EXIST —
# auto-setup publishing stopped after 1.29. Use temporalio/auto-setup:1.29.7
# (verified, latest auto-setup tag). Do NOT substitute temporalio/server —
# it has no auto-setup behaviour. Port 7233. Temporal DBs (temporal,
# temporal_visibility) are created by the postgres init script on a fresh
# volume; auto-setup creates the schema. deploy-kind.sh waits for postgres
# before this rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
        app.kubernetes.io/name: epitomejob
        app.kubernetes.io/component: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7233
              name: grpc
          env:
            - name: DB
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: DB
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: DB_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: POSTGRES_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: epitomejob-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SEEDS
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: POSTGRES_SEEDS
            - name: DBNAME
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: DBNAME
            - name: VISIBILITY_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: VISIBILITY_DBNAME
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # TCP probe, not `tctl cluster health`: whether tctl ships in the
          # auto-setup image is not guaranteed by the contract, and the
          # contract §2a fallback is a TCP connect to 7233.
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: temporal
spec:
  type: ClusterIP
  selector:
    app: temporal
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc
