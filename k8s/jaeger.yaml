# EpitomeJob Phase 5A — jaeger (all-in-one, UI 16686 + OTLP gRPC 4317 + OTLP HTTP 4318).
# Receives OTLP directly from the gateway (javaagent) and backend
# (micrometer OTel bridge) — no OTel Collector in 5A (see README: the
# collector sidecar was deliberately NOT added; the all-in-one already
# speaks OTLP and a sidecar would double the moving parts for zero gain
# at this scale). COLLECTOR_OTLP_ENABLED is set explicitly even though
# 1.62 enables the OTLP receiver by default.
# Health probe: httpGet / on the UI port (no exec probe — the image's
# shell/tool set is not guaranteed; the UI serves / on 16686).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: epitomejob
        app.kubernetes.io/component: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
