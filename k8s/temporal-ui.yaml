# EpitomeJob W4 — temporal-ui.
# W4-API-CONTRACT.md §2a/§4/§6: image temporalio/ui:2.56.1. The UI serves on
# port 8080 IN the container; the Service exposes it as 8233 (contract §6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
        app.kubernetes.io/name: epitomejob
        app.kubernetes.io/component: temporal-ui
    spec:
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.56.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: TEMPORAL_ADDRESS
            - name: TEMPORAL_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: TEMPORAL_CORS_ORIGINS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Exec probe with BusyBox wget: the ui image has NO curl (verified
          # 2026-11-12). Port 8080 in-container; the Service exposes 8233.
          readinessProbe:
            exec:
              command: ["wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: temporal-ui
spec:
  type: ClusterIP
  selector:
    app: temporal-ui
  ports:
    - port: 8233
      targetPort: 8080
      name: http
