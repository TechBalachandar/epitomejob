# EpitomeJob W4 — secrets (PLACEHOLDER VALUES ONLY).
# W4-API-CONTRACT.md §4.
#
# *** NEVER commit real secrets in this file. ***
# The values below are the frozen contract §2a DEV DEFAULTS (or empty for
# Stripe, which is not configured) — not real credentials. They exist so the
# kind stack boots out of the box on the user's Mac, exactly like compose
# with its dev defaults.
#
# To use real values, replace the Secret in the cluster (never in git):
#   kubectl -n epitomejob create secret generic epitomejob-secrets \
#     --from-literal=POSTGRES_PASSWORD='<real password>' \
#     --from-literal=APP_JWT_SECRET='<real 64-hex-char secret>' \
#     --from-literal=MINIO_SECRET_KEY='<real minio secret>' \
#     --from-literal=STRIPE_SECRET_KEY='<sk_...>' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='<whsec_...>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# then restart the Deployments that consume them.
# (Azure Key Vault is the production option — see deploy-aks.md.)
#
# Key usage (each key is referenced by exactly the services that need it):
#   POSTGRES_PASSWORD    postgres, backend (SPRING_DATASOURCE_PASSWORD),
#                        agent-brain family (DATABASE_URL), temporal (POSTGRES_PWD)
#   APP_JWT_SECRET       backend
#   MINIO_SECRET_KEY     rustfs (RUSTFS_SECRET_KEY), backend (MINIO_SECRET_KEY)
#                        — one shared dev value, matching contract §2a (minioadmin-dev)
#   STRIPE_SECRET_KEY    backend — EMPTY = Stripe not configured; the backend
#                        answers POST /billing/checkout with 503 BILLING_NOT_CONFIGURED
#                        (contract §1a). Never silently falls back to the fake provider.
#   STRIPE_WEBHOOK_SECRET backend — empty until Stripe is linked.
apiVersion: v1
kind: Secret
metadata:
  name: epitomejob-secrets
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
type: Opaque
stringData:
  POSTGRES_PASSWORD: "epitomejob-dev"
  APP_JWT_SECRET: "dev-only-secret-change-me"
  MINIO_SECRET_KEY: "minioadmin-dev"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
