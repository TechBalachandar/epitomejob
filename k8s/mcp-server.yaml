# EpitomeJob W4 — mcp-server (FastMCP SSE server, port 8001).
# Phase 5B: image is now epitomejob/mcp-service:5b, built locally from
# ./mcp-service (5B worker) — no longer the agent-brain image. Command
# `python -m app.mcp.server`, port 8001, env and TCP probes unchanged.
# JAVA_BASE_URL comes from epitomejob-config and is now
# http://backend:8081 (see configmap.yaml) — this file has no env change.
#
# Probes: TCP only. The MCP server exposes NO /health endpoint — /sse is an
# authenticated SSE stream, so an HTTP probe would hang/fail. A TCP connect
# proves the process is listening on 8001.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        app.kubernetes.io/name: epitomejob
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: epitomejob/mcp-service:5b
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.mcp.server"]
          ports:
            - containerPort: 8001
              name: sse
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epitomejob-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://epitomejob:$(POSTGRES_PASSWORD)@postgres:5432/epitomejob"
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: TEMPORAL_ADDRESS
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_CHAT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: OLLAMA_CHAT_MODEL
            - name: OLLAMA_EMBED_MODEL
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: OLLAMA_EMBED_MODEL
            - name: JAVA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: JAVA_BASE_URL
            - name: AGENT_BRAIN_PORT
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: AGENT_BRAIN_PORT
            - name: MCP_PORT
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: MCP_PORT
            - name: TEMPORAL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: TEMPORAL_ENABLED
            - name: LANGSMITH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: epitomejob-config
                  key: LANGSMITH_ENABLED
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: epitomejob
  labels:
    app.kubernetes.io/name: epitomejob
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
    - port: 8001
      targetPort: 8001
      name: sse
