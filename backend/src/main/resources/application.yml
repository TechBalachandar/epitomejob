# EpitomeJob Phase 5A — backend application.yml (patched from main b59dc45).
# Changes vs live: spring.application.name epitomejob -> epitomejob-backend;
# top-level `eureka:` client block added; test profile disables Eureka
# registration/fetch so the 293-test suite cannot break.
#
# All secret lines (spring.datasource.password, app.jwt.secret, test-profile
# password) are byte-identical to the live file — untouched by this patch.
# (The GitHub connector DISPLAY redacts secret values as <redacted>; the
# file bytes on disk were read directly and the secret lines were not edited.)
server:
  port: 8080
spring:
  application:
    name: epitomejob-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/epitomejob
    username: epitomejob
    password: epitomejob-dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
eureka:
  # Phase 5A: Eureka client. defaultZone defaults to localhost so manual
  # dev (mvn spring-boot:run, no compose) still works; compose/k8s set
  # EUREKA_URL=http://eureka:8761/eureka. register/fetch default true;
  # the test profile below turns both off.
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:CHANGE_ME_64_HEX_CHARS_MINIMUM_REPLACE_BEFORE_USE_0123456789abcdef}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin-dev}
    bucket: ${MINIO_BUCKET:resumes}
  agent-brain:
    url: ${AGENT_BRAIN_URL:http://localhost:8000}
  # Public web origin — Stripe Checkout redirects here after payment.
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
features:
  billing:
    enabled: ${BILLING_ENABLED:false}
    provider: ${BILLING_PROVIDER:stripe}   # stripe | fake
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.epitomejob: INFO
springdoc:
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:epitomejob-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false
eureka:
  # Phase 5A: the 293-test suite must NEVER touch a Eureka server.
  # Registration and registry fetch are both off under the test profile.
  client:
    register-with-eureka: false
    fetch-registry: false
