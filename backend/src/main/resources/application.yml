server:
  port: 8080
spring:
  application:
    name: epitomejob
  datasource:
    url: jdbc:postgresql://localhost:5432/epitomejob
    username: epitomejob
    password: epitomejob-dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${APP_JWT_SECRET:CHANGE_ME_64_HEX_CHARS_MINIMUM_REPLACE_BEFORE_USE_0123456789abcdef}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin-dev}
    bucket: ${MINIO_BUCKET:resumes}
  agent-brain:
    url: ${AGENT_BRAIN_URL:http://localhost:8000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.epitomejob: INFO
springdoc:
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:epitomejob-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false
