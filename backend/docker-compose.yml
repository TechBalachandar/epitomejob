services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: epitomejob
      POSTGRES_USER: epitomejob
      POSTGRES_PASSWORD: epitomejob-dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epitomejob -d epitomejob"]
      interval: 5s
      timeout: 5s
      retries: 10
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin-dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [rustfsdata:/data]
volumes: { pgdata: {}, rustfsdata: {} }
