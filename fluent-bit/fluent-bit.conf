# EpitomeJob Phase 5A — fluent-bit config for the root compose stack.
# Mounted at /fluent-bit/etc/fluent-bit.conf (see docker-compose.yml).
#
# CORRECTION vs the brief: container LOGS do not come from the Docker
# socket. Fluent Bit's built-in `docker` input plugin reads cgroup METRICS,
# not logs, and `docker_events` only streams daemon events. Logs are read
# with the `tail` input from the Docker log dir
# (/var/lib/docker/containers/*/*.log, docker JSON-log format, parsed by
# the built-in `docker` parser). The /var/run/docker.sock mount is kept
# (tasked) so docker_events can be enabled later; it is not the log source.
# On Docker Desktop (Mac) the /var/lib/docker/containers bind mount resolves
# inside the Docker Desktop VM, where the log files live — this works there.
#
# PER-SERVICE INDEX LIMIT (honest): fluent-bit 3.2's Elasticsearch output
# takes a STATIC Index value — it cannot build one index per service from a
# record field. All logs therefore go to the `epitomejob-logs` index
# (Logstash format OFF, see below) and per-service separation is by the
# `container_name` / `service` fields (added by the record_modifier filter)
# in Kibana. A true per-service index needs one ES output per service with
# a rewrite_tag stage; that is a follow-up, not faked here.
[SERVICE]
    Flush        5
    Log_Level    info
    Daemon       off

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /tmp/flb_docker.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name                record_modifier
    Match               docker.*
    # Compose container names look like epitomejob-backend-1; strip the
    # project prefix and -N suffix so Kibana can group by service.
    Record              compose_project epitomejob

[OUTPUT]
    Name              es
    Match             docker.*
    Host              elasticsearch
    Port              9200
    Index             epitomejob-logs
    Type              _doc
    Logstash_Format   Off
    Include_Tag_Key   On
    Tag_Key           fb_tag
    Generate_ID       On
    Replace_Dots      On
    Retry_Limit       False
